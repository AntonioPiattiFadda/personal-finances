<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanzas · Mockup</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f1f3f5;
    --border: #e3e6ea;
    --text: #1b1f24;
    --muted: #68707c;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --pos: #12805c;
    --neg: #c92a2a;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --surface: #171a20; --surface-2: #1f232b; --border: #2a2f39;
      --text: #e8eaee; --muted: #9aa2ae; --accent: #8b85ff; --accent-soft: #23234a;
      --pos: #3ccf91; --neg: #ff6b6b; --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --surface: #171a20; --surface-2: #1f232b; --border: #2a2f39;
    --text: #e8eaee; --muted: #9aa2ae; --accent: #8b85ff; --accent-soft: #23234a;
    --pos: #3ccf91; --neg: #ff6b6b; --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, 'Segoe UI', Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  aside { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 12px; position: sticky; top: 0; height: 100vh; }
  .brand { font-weight: 700; font-size: 18px; padding: 0 10px 18px; display: flex; gap: 8px; align-items: center; }
  .brand i { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: inline-block; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 500; }
  nav a:hover { background: var(--surface-2); color: var(--text); }
  nav a.active { background: var(--accent-soft); color: var(--accent); }
  nav .ico { width: 20px; text-align: center; }
  main { padding: 28px 32px 80px; max-width: 1180px; width: 100%; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  h2 { font-size: 15px; margin: 0 0 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .stack > * + * { margin-top: 16px; }
  .label { color: var(--muted); font-size: 13px; }
  .big { font-size: 34px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
  .muted { color: var(--muted); }
  .hero { background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%); color: #fff; border: 0; }
  .hero .label { color: rgba(255,255,255,.8); }
  .hero .stat { background: rgba(255,255,255,.12); border-radius: 12px; padding: 12px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 500;
          background: color-mix(in srgb, var(--c) 14%, transparent); color: color-mix(in srgb, var(--c) 75%, var(--text)); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
  .chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  button.chip { cursor: pointer; font: inherit; font-size: 12.5px; opacity: .55; }
  button.chip.on { opacity: 1; box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 45%, transparent); }
  .badge { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-weight: 600; }
  .ico-box { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); font-size: 17px; flex: none; }
  form .fields { display: grid; grid-template-columns: 1.1fr 2fr 1fr 1.2fr; gap: 12px; }
  label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
  input, select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; width: 100%; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  input.amount { font-size: 20px; font-weight: 650; }
  .btn { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 16px; background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
  .btn.ghost { background: var(--surface-2); color: var(--text); }
  .btn.sm { padding: 6px 11px; font-size: 13px; }
  .icon-btn { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 8px; }
  .icon-btn:hover { background: var(--surface-2); color: var(--neg); }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 11px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.r, th.r { text-align: right; }
  .table-wrap { overflow-x: auto; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13.5px; font-weight: 500; margin-top: 12px; }
  .person { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .person + .person { margin-top: 10px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; }
  .theme-toggle { position: fixed; top: 14px; right: 16px; z-index: 5; }
  .mockbar { font-size: 12px; color: var(--muted); padding: 10px 10px 0; position: absolute; bottom: 16px; left: 12px; right: 12px; }
  @media (max-width: 900px) {
    .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .g3, .g2 { grid-template-columns: 1fr; }
    form .fields { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 680px) {
    .app { grid-template-columns: 1fr; }
    aside { position: fixed; bottom: 0; top: auto; left: 0; right: 0; height: auto; padding: 6px; border-right: 0; border-top: 1px solid var(--border); z-index: 10; }
    .brand, .mockbar { display: none; }
    nav { display: flex; overflow-x: auto; gap: 2px; }
    nav a { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 10px; flex: none; }
    main { padding: 20px 16px 100px; }
    .big { font-size: 28px; }
    form .fields { grid-template-columns: 1fr; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<button class="btn ghost sm theme-toggle" id="theme">◐ Tema</button>
<div class="app">
  <aside>
    <div class="brand"><i></i>Finanzas</div>
    <nav id="nav"></nav>
    <div class="mockbar">Mockup con datos de ejemplo · nada se guarda</div>
  </aside>
  <main id="main"></main>
</div>

<script>
// ---------- Datos de ejemplo ----------
const tags = {
  super:  { name: 'Supermercado', color: '#2f9e44' },
  rest:   { name: 'Restaurantes', color: '#e8590c' },
  trans:  { name: 'Transporte',   color: '#1c7ed6' },
  ocio:   { name: 'Ocio',         color: '#ae3ec9' },
  casa:   { name: 'Casa',         color: '#f08c00' },
  salud:  { name: 'Salud',        color: '#0ca678' },
  regalo: { name: 'Regalos',      color: '#e64980' },
  viaje:  { name: 'Viajes',       color: '#4263eb' },
  subs:   { name: 'Suscripciones',color: '#7048e8' },
};
const TYPE = { bank: ['Banco','🏦'], cash: ['Efectivo','💵'], savings: ['Ahorro','🐷'], broker: ['Broker','📈'], crypto: ['Cripto','🪙'], other: ['Otro','📁'] };
const accounts = [
  { id: 'n26',  name: 'N26',            type: 'bank',    balance: 2340.50, upd: '2026-10-27' },
  { id: 'bbva', name: 'BBVA',           type: 'bank',    balance: 1180.00, upd: '2026-10-20' },
  { id: 'cash', name: 'Billetera',      type: 'cash',    balance:   85.00, upd: '2026-10-28' },
  { id: 'rev',  name: 'Revolut Ahorro', type: 'savings', balance: 5000.00, upd: '2026-10-01' },
  { id: 'tr',   name: 'Trade Republic', type: 'broker',  balance:  120.00, upd: '2026-10-25' },
  { id: 'bin',  name: 'Binance',        type: 'crypto',  balance:    0.00, upd: '2026-09-30' },
];
const investments = [
  { name: 'MSCI World ETF',   acc: 'tr',  invested: 6000, value: 6890, first: '2025-03-10', last: '2026-10-28',
    hist: [['2026-10-28','Valoración',6890],['2026-10-01','Aporte',300],['2026-10-01','Valoración',6720],['2026-07-15','Valoración',6310],['2025-03-10','Aporte inicial',5700]] },
  { name: 'S&P 500 ETF',      acc: 'tr',  invested: 3000, value: 3215, first: '2025-09-01', last: '2026-10-28', hist: [] },
  { name: 'Bitcoin',          acc: 'bin', invested: 1500, value: 1320, first: '2025-11-20', last: '2026-10-15', hist: [] },
  { name: 'Letras del Tesoro',acc: null,  invested: 2000, value: 2052, first: '2026-04-10', last: '2026-10-10', hist: [] },
];
const debts = [
  { person: 'Lucía',  dir: 'owed_to_me', amount: 120, paid: 40,  desc: 'Cena del viaje a Lisboa', date: '2026-10-05' },
  { person: 'Marcos', dir: 'owed_to_me', amount: 300, paid: 0,   desc: 'Préstamo',               date: '2026-09-18' },
  { person: 'Marcos', dir: 'i_owe',      amount: 45,  paid: 0,   desc: 'Entradas concierto',     date: '2026-10-12' },
  { person: 'Papá',   dir: 'i_owe',      amount: 500, paid: 200, desc: 'Arreglo del coche',      date: '2026-08-02' },
  { person: 'Ana',    dir: 'owed_to_me', amount: 60,  paid: 60,  desc: 'Regalo de cumple a Pablo', date: '2026-07-20' },
];
const FREQ = { monthly: ['Mensual',1], quarterly: ['Trimestral',1/3], semiannual: ['Semestral',1/6], yearly: ['Anual',1/12] };
const recurring = [
  { name: 'Nómina',          kind: 'income',  amount: 2450,  freq: 'monthly', acc: 'n26',  tags: [] },
  { name: 'Freelance',       kind: 'income',  amount: 400,   freq: 'monthly', acc: 'bbva', tags: [] },
  { name: 'Alquiler',        kind: 'expense', amount: 850,   freq: 'monthly', acc: 'n26',  tags: ['casa'] },
  { name: 'Internet + móvil',kind: 'expense', amount: 45,    freq: 'monthly', acc: 'n26',  tags: ['casa','subs'] },
  { name: 'Gimnasio',        kind: 'expense', amount: 39.9,  freq: 'monthly', acc: 'n26',  tags: ['salud'] },
  { name: 'Spotify',         kind: 'expense', amount: 10.99, freq: 'monthly', acc: 'n26',  tags: ['subs'] },
  { name: 'Seguro coche',    kind: 'expense', amount: 420,   freq: 'yearly',  acc: 'bbva', tags: ['trans'] },
  { name: 'Seguro hogar',    kind: 'expense', amount: 96,    freq: 'quarterly', acc: 'bbva', tags: ['casa'] },
];
const expenses = [
  ['2026-10-28', 'Mercadona',              64.30, 'n26',  ['super']],
  ['2026-10-27', 'Cena con Lucía',         48.00, 'n26',  ['rest','ocio']],
  ['2026-10-26', 'Gasolina',               55.00, 'bbva', ['trans']],
  ['2026-10-25', 'Cine',                   18.50, 'cash', ['ocio']],
  ['2026-10-23', 'Farmacia',               12.80, 'cash', ['salud']],
  ['2026-10-22', 'Regalo cumple mamá',     75.00, 'n26',  ['regalo']],
  ['2026-10-20', 'Lidl',                   41.15, 'n26',  ['super']],
  ['2026-10-18', 'Brunch',                 26.40, 'n26',  ['rest']],
  ['2026-10-15', 'Abono transporte',       20.00, 'n26',  ['trans']],
  ['2026-10-12', 'Vuelo Oporto',          112.00, 'bbva', ['viaje']],
  ['2026-10-10', 'Ikea',                   89.99, 'n26',  ['casa']],
  ['2026-10-08', 'Mercadona',              71.60, 'n26',  ['super']],
  ['2026-10-05', 'Café',                    3.20, 'cash', []],
  ['2026-10-03', 'Concierto',              45.00, 'n26',  ['ocio']],
].map(([date, desc, amount, acc, t]) => ({ date, desc, amount, acc, tags: t }));

// ---------- Utilidades ----------
const fmt = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });
const money = n => fmt.format(n);
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt.format(Math.abs(n));
const pct = n => n == null ? '—' : (n >= 0 ? '+' : '−') + Math.abs(n * 100).toFixed(1).replace('.', ',') + ' %';
const cls = n => n > 0 ? 'pos' : n < 0 ? 'neg' : '';
const d = s => s.split('-').reverse().join('/');
const sum = a => a.reduce((s, x) => s + x, 0);
const chip = id => id ? `<span class="chip" style="--c:${tags[id].color}">${tags[id].name}</span>` : `<span class="chip" style="--c:#868e96">Sin etiqueta</span>`;
const accName = id => accounts.find(a => a.id === id)?.name ?? '—';
const monthly = r => r.amount * FREQ[r.freq][1];
const remaining = x => x.amount - x.paid;
const colors = ['#4f46e5','#e8590c','#0ca678','#e64980','#1c7ed6','#f08c00'];

for (const i of investments) {
  i.gain = i.value - i.invested; i.ret = i.gain / i.invested;
  const days = (Date.parse(i.last) - Date.parse(i.first)) / 864e5;
  i.annual = days >= 30 ? Math.pow(i.value / i.invested, 365 / days) - 1 : null;
}
const totals = {
  accounts: sum(accounts.map(a => a.balance)),
  inv: sum(investments.map(i => i.value)),
  invGain: sum(investments.map(i => i.gain)),
  owed: sum(debts.filter(x => x.dir === 'owed_to_me').map(remaining)),
  owe: sum(debts.filter(x => x.dir === 'i_owe').map(remaining)),
};
totals.net = totals.accounts + totals.inv + totals.owed - totals.owe;
const fixedIn = sum(recurring.filter(r => r.kind === 'income').map(monthly));
const fixedOut = sum(recurring.filter(r => r.kind === 'expense').map(monthly));
const varTotal = sum(expenses.map(e => e.amount));

function byTag(list) {
  const m = new Map();
  for (const e of list) for (const t of (e.tags.length ? e.tags : [null])) m.set(t, (m.get(t) ?? 0) + e.amount);
  return [...m].sort((a, b) => b[1] - a[1]);
}
function tagBars(list) {
  const rows = byTag(list); const max = rows[0]?.[1] ?? 1;
  return rows.map(([t, v]) => `
    <div class="row">
      <div style="width:130px">${chip(t)}</div>
      <div class="grow bar"><i style="width:${v / max * 100}%;background:${t ? tags[t].color : '#868e96'}"></i></div>
      <div class="num" style="width:90px;text-align:right">${money(v)}</div>
    </div>`).join('') + `<p class="note">Un gasto con varias etiquetas suma en cada una, así que el total por etiquetas puede superar el total gastado.</p>`;
}

// ---------- Pantallas ----------
const views = {
  resumen() {
    const loc = accounts.map(a => {
      const inv = sum(investments.filter(i => i.acc === a.id).map(i => i.value));
      return { name: a.name, type: a.type, cash: a.balance, inv, total: a.balance + inv };
    });
    const noLoc = sum(investments.filter(i => !i.acc).map(i => i.value));
    if (noLoc) loc.push({ name: 'Sin ubicación', type: 'other', cash: 0, inv: noLoc, total: noLoc });
    loc.sort((a, b) => b.total - a.total);
    const maxLoc = loc[0].total;
    const left = fixedIn - fixedOut - varTotal;
    return `
      <h1>Resumen</h1><p class="sub">Octubre 2026</p>
      <div class="stack">
        <section class="card hero">
          <div class="label">Patrimonio neto</div>
          <div class="big">${money(totals.net)}</div>
          <div class="grid g4" style="margin-top:16px">
            <div class="stat"><div class="label">En cuentas</div><div class="v">${money(totals.accounts)}</div></div>
            <div class="stat"><div class="label">Inversiones</div><div class="v">${money(totals.inv)}</div><div class="label">${signed(totals.invGain)} de ganancia</div></div>
            <div class="stat"><div class="label">Me deben</div><div class="v">${money(totals.owed)}</div></div>
            <div class="stat"><div class="label">Debo</div><div class="v">−${money(totals.owe)}</div></div>
          </div>
        </section>
        <div class="grid g2">
          <section class="card">
            <h2>Dónde está la plata</h2>
            ${loc.map(l => `
              <div class="row">
                <div class="ico-box">${TYPE[l.type][1]}</div>
                <div class="grow">
                  <div class="between"><strong>${l.name}</strong><span class="num">${money(l.total)}</span></div>
                  <div class="bar" style="margin-top:6px"><i style="width:${l.total / maxLoc * 100}%;background:var(--accent)"></i></div>
                  ${l.inv ? `<div class="label" style="margin-top:4px">${money(l.cash)} en cuenta · ${money(l.inv)} invertido</div>` : ''}
                </div>
              </div>`).join('')}
          </section>
          <section class="card">
            <h2>Este mes</h2>
            <div class="row"><div class="grow">Ingresos fijos</div><div class="num pos">+${money(fixedIn)}</div></div>
            <div class="row"><div class="grow">Gastos fijos <span class="muted">(equivalente mensual)</span></div><div class="num neg">−${money(fixedOut)}</div></div>
            <div class="row"><div class="grow">Gastos variables</div><div class="num neg">−${money(varTotal)}</div></div>
            <div class="row"><div class="grow"><strong>Queda</strong></div><div class="num ${cls(left)}"><strong>${signed(left)}</strong></div></div>
            <div style="margin-top:14px">
              <div class="between label"><span>Gastado del disponible para variables</span><span>${Math.round(varTotal / (fixedIn - fixedOut) * 100)} %</span></div>
              <div class="bar" style="margin-top:6px;height:10px"><i style="width:${varTotal / (fixedIn - fixedOut) * 100}%;background:var(--pos)"></i></div>
            </div>
          </section>
        </div>
        <section class="card"><h2>Gastos variables por etiqueta</h2>${tagBars(expenses)}</section>
      </div>`;
  },

  gastos() {
    return `
      <h1>Gastos variables</h1><p class="sub">Apunta cada gasto y etiquétalo como quieras</p>
      <div class="stack">
        <form class="card" onsubmit="return false">
          <h2>Nuevo gasto</h2>
          <div class="fields">
            <label class="f">Importe<input class="amount" placeholder="0,00 €" inputmode="decimal" autofocus></label>
            <label class="f">Descripción<input placeholder="Mercadona, café, cine…"></label>
            <label class="f">Fecha<input type="date" value="2026-10-28"></label>
            <label class="f">Pagado desde<select>${accounts.filter(a => a.type !== 'broker' && a.type !== 'crypto').map(a => `<option>${a.name}</option>`).join('')}</select></label>
          </div>
          <div style="margin-top:14px">
            <div class="label" style="margin-bottom:6px">Etiquetas</div>
            <div class="chips">
              ${Object.entries(tags).map(([id, t], i) => `<button type="button" class="chip ${i === 1 ? 'on' : ''}" style="--c:${t.color}" onclick="this.classList.toggle('on')">${t.name}</button>`).join('')}
              <input placeholder="+ nueva etiqueta" style="width:150px;padding:3px 10px;border-radius:99px;font-size:12.5px">
            </div>
          </div>
          <div class="between" style="margin-top:16px">
            <label class="actions" style="font-size:14px"><input type="checkbox" checked style="width:auto"> Descontar del saldo de la cuenta</label>
            <button class="btn">Añadir gasto</button>
          </div>
        </form>
        <div class="grid g3" style="grid-template-columns:2fr 1fr">
          <section class="card">
            <div class="between" style="margin-bottom:10px">
              <h2 style="margin:0">Movimientos</h2>
              <div class="actions">
                <input type="month" value="2026-10" style="width:auto">
                <select style="width:auto"><option>Todas las etiquetas</option>${Object.values(tags).map(t => `<option>${t.name}</option>`).join('')}<option>Sin etiqueta</option></select>
                <select style="width:auto" class="hide-sm"><option>Todas las cuentas</option>${accounts.map(a => `<option>${a.name}</option>`).join('')}</select>
              </div>
            </div>
            <div class="table-wrap"><table>
              <thead><tr><th>Fecha</th><th>Descripción</th><th class="hide-sm">Etiquetas</th><th class="hide-sm">Cuenta</th><th class="r">Importe</th><th></th></tr></thead>
              <tbody>${expenses.map(e => `
                <tr><td class="muted num">${d(e.date).slice(0, 5)}</td><td>${e.desc}</td>
                <td class="hide-sm"><div class="chips">${e.tags.length ? e.tags.map(chip).join('') : chip(null)}</div></td>
                <td class="hide-sm muted">${accName(e.acc)}</td><td class="r num">${money(e.amount)}</td>
                <td><button class="icon-btn" title="Borrar">✕</button></td></tr>`).join('')}
              </tbody>
            </table></div>
          </section>
          <section class="card">
            <div class="label">Total octubre</div><div class="big" style="font-size:28px">${money(varTotal)}</div>
            <div class="label" style="margin-bottom:8px">${expenses.length} gastos</div>
            ${tagBars(expenses)}
          </section>
        </div>
      </div>`;
  },

  fijos() {
    const table = kind => {
      const list = recurring.filter(r => r.kind === kind);
      return `<div class="table-wrap"><table>
        <thead><tr><th>Concepto</th><th class="hide-sm">Frecuencia</th><th class="r">Importe</th><th class="r">Al mes</th><th></th></tr></thead>
        <tbody>${list.map(r => `<tr>
          <td><strong>${r.name}</strong><div class="chips" style="margin-top:4px">${r.tags.map(chip).join('')}<span class="label">${accName(r.acc)}</span></div></td>
          <td class="hide-sm"><span class="badge">${FREQ[r.freq][0]}</span></td>
          <td class="r num">${money(r.amount)}</td><td class="r num"><strong>${money(monthly(r))}</strong></td>
          <td><button class="icon-btn">✕</button></td></tr>`).join('')}</tbody></table></div>`;
    };
    return `
      <div class="between"><div><h1>Ingresos y gastos fijos</h1><p class="sub">Lo que entra y sale todos los meses (o cada tanto)</p></div><button class="btn">+ Nuevo fijo</button></div>
      <div class="stack">
        <div class="grid g3">
          <div class="card stat"><div class="label">Ingresos fijos / mes</div><div class="v pos">+${money(fixedIn)}</div></div>
          <div class="card stat"><div class="label">Gastos fijos / mes</div><div class="v neg">−${money(fixedOut)}</div></div>
          <div class="card stat"><div class="label">Disponible para variables</div><div class="v">${money(fixedIn - fixedOut)}</div><div class="label">${money((fixedIn - fixedOut) * 12)} al año</div></div>
        </div>
        <section class="card"><h2>💰 Ingresos</h2>${table('income')}</section>
        <section class="card"><h2>🧾 Gastos fijos</h2>${table('expense')}</section>
      </div>`;
  },

  inversiones() {
    const ret = totals.invGain / sum(investments.map(i => i.invested));
    return `
      <div class="between"><div><h1>Inversiones</h1><p class="sub">Actualiza el valor cada tanto y mira cuánto rinde</p></div><button class="btn">+ Nueva inversión</button></div>
      <div class="stack">
        <div class="grid g4">
          <div class="card stat"><div class="label">Aportado</div><div class="v">${money(sum(investments.map(i => i.invested)))}</div></div>
          <div class="card stat"><div class="label">Valor actual</div><div class="v">${money(totals.inv)}</div></div>
          <div class="card stat"><div class="label">Ganancia</div><div class="v ${cls(totals.invGain)}">${signed(totals.invGain)}</div></div>
          <div class="card stat"><div class="label">Rentabilidad</div><div class="v ${cls(ret)}">${pct(ret)}</div></div>
        </div>
        <div class="grid g2">${investments.map((i, n) => `
          <article class="card">
            <div class="between">
              <div><h2 style="margin:0">${i.name}</h2><div class="label">${i.acc ? TYPE[accounts.find(a => a.id === i.acc).type][1] + ' ' + accName(i.acc) : 'Sin ubicación'} · actualizado ${d(i.last)}</div></div>
              <div class="num ${cls(i.ret)}" style="font-size:20px;font-weight:700">${pct(i.ret)}</div>
            </div>
            <div class="grid g3" style="margin-top:14px">
              <div class="stat"><div class="label">Aportado</div><div class="num">${money(i.invested)}</div></div>
              <div class="stat"><div class="label">Valor actual</div><div class="num"><strong>${money(i.value)}</strong></div></div>
              <div class="stat"><div class="label">Ganancia</div><div class="num ${cls(i.gain)}">${signed(i.gain)}</div></div>
            </div>
            <div class="label" style="margin-top:8px">Anualizada aprox.: <span class="${cls(i.annual)}">${pct(i.annual)}</span></div>
            <div class="actions" style="margin-top:14px">
              <input placeholder="Nuevo valor" inputmode="decimal" style="width:130px"><button class="btn sm">Actualizar valor</button>
              <button class="btn ghost sm">Aportar / retirar</button>
            </div>
            <details ${n === 0 ? 'open' : ''}><summary>Historial</summary>
              ${i.hist.length ? `<table style="margin-top:6px">${i.hist.map(h => `<tr><td class="muted num">${d(h[0])}</td><td>${h[1]}</td><td class="r num">${money(h[2])}</td></tr>`).join('')}</table>` : '<p class="note">Sin movimientos de ejemplo.</p>'}
            </details>
          </article>`).join('')}
        </div>
      </div>`;
  },

  deudas() {
    const people = [...new Set(debts.map(x => x.person))];
    const active = debts.filter(x => remaining(x) > 0);
    const col = dir => {
      const list = active.filter(x => x.dir === dir);
      const byP = people.filter(p => list.some(x => x.person === p));
      return byP.map((p, n) => {
        const items = list.filter(x => x.person === p);
        const net = sum(debts.filter(x => x.person === p && x.dir === 'owed_to_me').map(remaining)) - sum(debts.filter(x => x.person === p && x.dir === 'i_owe').map(remaining));
        const both = debts.some(x => x.person === p && x.dir !== dir && remaining(x) > 0);
        return `<div class="person">
          <div class="row" style="padding-top:0">
            <div class="avatar" style="background:${colors[people.indexOf(p) % colors.length]}">${p[0]}</div>
            <div class="grow"><strong>${p}</strong>${both ? `<div class="label">Neto con ${p}: <span class="${cls(net)}">${signed(net)}</span></div>` : ''}</div>
            <div class="num"><strong>${money(sum(items.map(remaining)))}</strong></div>
          </div>
          ${items.map(x => `<div class="row">
            <div class="grow"><div>${x.desc}</div><div class="label">${d(x.date)}${x.paid ? ` · pagado ${money(x.paid)} de ${money(x.amount)}` : ''}</div>
              ${x.paid ? `<div class="bar" style="margin-top:6px"><i style="width:${x.paid / x.amount * 100}%;background:var(--pos)"></i></div>` : ''}</div>
            <div class="actions"><span class="num">${money(remaining(x))}</span><button class="btn ghost sm">Pago parcial</button><button class="btn sm">Saldar</button></div>
          </div>`).join('')}
        </div>`;
      }).join('');
    };
    const settled = debts.filter(x => remaining(x) <= 0);
    return `
      <div class="between"><div><h1>Deudas</h1><p class="sub">Quién te debe y a quién le debes</p></div><button class="btn">+ Nueva deuda</button></div>
      <div class="grid g2">
        <section class="card"><div class="between"><h2>🙋 Me deben</h2><span class="num pos"><strong>${money(totals.owed)}</strong></span></div>${col('owed_to_me')}</section>
        <section class="card"><div class="between"><h2>🤝 Debo</h2><span class="num neg"><strong>${money(totals.owe)}</strong></span></div>${col('i_owe')}</section>
      </div>
      <details class="card" style="margin-top:16px"><summary style="margin:0">Saldadas (${settled.length})</summary>
        ${settled.map(x => `<div class="row"><div class="grow">${x.person} · ${x.desc}</div><span class="muted num">${money(x.amount)}</span><span class="badge">Saldada</span></div>`).join('')}
      </details>`;
  },

  cuentas() {
    const groups = Object.keys(TYPE).filter(t => accounts.some(a => a.type === t));
    return `
      <div class="between"><div><h1>Cuentas</h1><p class="sub">Dónde tienes el dinero. Actualiza el saldo mirando tu banco.</p></div><button class="btn">+ Nueva cuenta</button></div>
      <div class="stack">
        <div class="card between"><div><div class="label">Total en cuentas</div><div class="big" style="font-size:28px">${money(totals.accounts)}</div></div><span class="label">No incluye el valor de las inversiones</span></div>
        <div class="grid g2">${groups.map(t => `
          <section class="card">
            <div class="between"><h2>${TYPE[t][1]} ${TYPE[t][0]}</h2><span class="num muted">${money(sum(accounts.filter(a => a.type === t).map(a => a.balance)))}</span></div>
            ${accounts.filter(a => a.type === t).map(a => `
              <div class="row">
                <div class="grow"><strong>${a.name}</strong><div class="label">Actualizado ${d(a.upd)}</div></div>
                <input class="num" value="${a.balance.toFixed(2).replace('.', ',')}" style="width:120px;text-align:right">
                <button class="icon-btn" title="Archivar">🗄</button>
              </div>`).join('')}
          </section>`).join('')}
        </div>
      </div>`;
  },

  etiquetas() {
    const use = id => expenses.filter(e => e.tags.includes(id));
    return `
      <h1>Etiquetas</h1><p class="sub">Organiza tus gastos como quieras</p>
      <div class="stack">
        <form class="card actions" onsubmit="return false">
          <input placeholder="Nombre de la etiqueta" style="flex:1;min-width:180px">
          <input type="color" value="#4f46e5" style="width:48px;padding:4px;height:40px">
          <button class="btn">Crear etiqueta</button>
        </form>
        <section class="card table-wrap"><table>
          <thead><tr><th>Etiqueta</th><th>Color</th><th class="r">Gastos</th><th class="r hide-sm">Fijos</th><th class="r">Total gastado</th><th></th></tr></thead>
          <tbody>${Object.entries(tags).map(([id, t]) => `<tr>
            <td>${chip(id)}</td>
            <td><input type="color" value="${t.color}" style="width:40px;padding:2px;height:30px"></td>
            <td class="r num">${use(id).length}</td>
            <td class="r num hide-sm">${recurring.filter(r => r.tags.includes(id)).length}</td>
            <td class="r num">${money(sum(use(id).map(e => e.amount)))}</td>
            <td><button class="icon-btn" title="Borrar">✕</button></td></tr>`).join('')}</tbody>
        </table></section>
      </div>`;
  },

  ajustes() {
    return `
      <h1>Ajustes</h1><p class="sub">Tu cuenta y preferencias</p>
      <section class="card stack" style="max-width:520px">
        <label class="f">Moneda<select><option>EUR · Euro</option><option>USD · Dólar</option><option>ARS · Peso argentino</option></select></label>
        <div class="row"><div class="grow"><strong>Sesión</strong><div class="label">antonio@ejemplo.com</div></div><button class="btn ghost">Cerrar sesión</button></div>
      </section>`;
  },

  login() {
    return `
      <div style="display:grid;place-items:center;min-height:70vh">
        <section class="card stack" style="width:100%;max-width:380px;text-align:center">
          <div class="brand" style="justify-content:center;padding:0"><i></i>Finanzas</div>
          <p class="muted" style="margin:0">Te enviamos un enlace mágico a tu correo para entrar.</p>
          <input type="email" placeholder="tu@correo.com">
          <button class="btn" style="width:100%">Enviar enlace</button>
        </section>
      </div>`;
  },
};

const NAV = [
  ['resumen','🏠','Resumen'], ['gastos','🛒','Gastos'], ['fijos','🔁','Fijos'], ['inversiones','📈','Inversiones'],
  ['deudas','🤝','Deudas'], ['cuentas','🏦','Cuentas'], ['etiquetas','🏷️','Etiquetas'], ['ajustes','⚙️','Ajustes'], ['login','🔑','Login'],
];
function render() {
  const tab = location.hash.slice(1) in views ? location.hash.slice(1) : 'resumen';
  document.getElementById('nav').innerHTML = NAV.map(([id, ico, label]) =>
    `<a href="#${id}" class="${id === tab ? 'active' : ''}"><span class="ico">${ico}</span>${label}</a>`).join('');
  document.getElementById('main').innerHTML = views[tab]();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
document.getElementById('theme').onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};
render();
</script>
</body>
</html>
